<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DNS Monitor</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>DNS Monitor</h1>

    <table>
        <thead>
            <tr>
                <th>Domain</th>
                <th>Last Checked</th>
                <th>Status</th>
                <th>IP / Error</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        const SERVER_URL = "";  // Using nginx proxy on same domain
        const tableBody = document.getElementById("table-body");
        const rows = {};

        // Format timestamp to client timezone (24-hour format)
        function formatClientTime(timestamp) {
            if (!timestamp) return "-";
            const date = new Date(timestamp);

            // Format: DD/MM/YYYY, HH:MM:SS (24-hour format)
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = date.getFullYear();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');

            return `${day}/${month}/${year}, ${hours}:${minutes}:${seconds}`;
        }

        // Format latency to 2 decimal places with "ms" suffix
        function formatLatency(latencyMs) {
            return latencyMs ? `${latencyMs.toFixed(2)} ms` : "-";
        }

        function updateRow(data) {
            if (!data.domain) return;

            const tr = rows[data.domain] || document.createElement("tr");
            rows[data.domain] = tr;

            tr.innerHTML = `
            <td>${data.domain} (${formatLatency(data.timeMs)})</td>
            <td>${formatClientTime(data.checkedAt)}</td>
            <td>${data.status.toUpperCase()}</td>
            <td>${data.ip || data.error || "-"}</td>
        `;

            if (!tr.parentNode) {
                tableBody.appendChild(tr);
            }
        }

        // Poll DNS status every 10 seconds (conservative approach)
        function pollDNSStatus() {
            fetch(`${SERVER_URL}/api/domains`)
                .then(response => response.json())
                .then(data => {
                    Object.values(data.data).forEach(updateRow);
                })
                .catch(error => {
                    console.error("Polling error:", error);
                });
        }

        // Initial poll
        pollDNSStatus();

        // Set up polling interval
        const pollInterval = setInterval(pollDNSStatus, 10000);
    </script>

</body>

</html>
