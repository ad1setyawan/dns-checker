<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DNS Monitor</title>
</head>

<body>

    <h1>DNS Monitor</h1>

    <table>
        <thead>
            <tr>
                <th>Domain</th>
                <th>Status</th>
                <th>IP / Error</th>
                <th>Time</th>
                <th>Latency</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        const SERVER_URL = "";  // Using nginx proxy on same domain
        const tableBody = document.getElementById("table-body");
        const rows = {};

        // Format timestamp to client timezone
        function formatClientTime(timestamp) {
            if (!timestamp) return "-";
            const date = new Date(timestamp);
            return date.toLocaleString(); // Client's local timezone
        }

        // Format latency to 2 decimal places
        function formatLatency(latencyMs) {
            return latencyMs ? latencyMs.toFixed(2) : "-";
        }

        function updateRow(data) {
            if (!data.domain) return;

            const tr = rows[data.domain] || document.createElement("tr");
            rows[data.domain] = tr;

            tr.innerHTML = `
            <td>${data.domain}</td>
            <td>${data.status.toUpperCase()}</td>
            <td>${data.ip || data.error || "-"}</td>
            <td>${formatClientTime(data.checkedAt)}</td>
            <td>${formatLatency(data.timeMs)}</td>
        `;

            if (!tr.parentNode) {
                tableBody.appendChild(tr);
            }
        }

        // Poll DNS status every 10 seconds (conservative approach)
        function pollDNSStatus() {
            fetch(`${SERVER_URL}/api/domains`)
                .then(response => response.json())
                .then(data => {
                    Object.values(data.data).forEach(updateRow);
                })
                .catch(error => {
                    console.error("Polling error:", error);
                });
        }

        // Initial poll
        pollDNSStatus();

        // Set up polling interval
        const pollInterval = setInterval(pollDNSStatus, 10000);
    </script>

</body>

</html>
